name: Website zu GitHub Pages deployen

on:
  push:
    branches: [claude/custom-website-skills-x2ii74]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-und-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: oasi-del-gusto/package-lock.json
      - name: Abhängigkeiten installieren
        run: npm ci
        working-directory: oasi-del-gusto
      - name: Seite bauen
        run: npm run build
        working-directory: oasi-del-gusto
      - name: I.MI-Seite unter /imi/ mitveröffentlichen
        run: cp -r imi-asia-cuisine oasi-del-gusto/out/imi
      - name: Auf GitHub Pages veröffentlichen (gh-pages Branch)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: oasi-del-gusto/out
