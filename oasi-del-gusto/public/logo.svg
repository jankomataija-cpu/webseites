<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 260" role="img" aria-label="Oasi del Gusto – Gelateria e Caffè">
  <defs>
    <linearGradient id="scoop1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8b4a0"/>
      <stop offset="1" stop-color="#c4704f"/>
    </linearGradient>
    <linearGradient id="scoop2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c3d9bb"/>
      <stop offset="1" stop-color="#a8c3a0"/>
    </linearGradient>
    <linearGradient id="scoop3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7ecd7"/>
      <stop offset="1" stop-color="#e8d5ae"/>
    </linearGradient>
    <linearGradient id="cone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9a441"/>
      <stop offset="1" stop-color="#a8742a"/>
    </linearGradient>
  </defs>

  <!-- Gelato-Icon -->
  <g transform="translate(220 14)">
    <circle cx="-22" cy="34" r="19" fill="url(#scoop2)"/>
    <circle cx="22" cy="34" r="19" fill="url(#scoop1)"/>
    <circle cx="0" cy="20" r="21" fill="url(#scoop3)"/>
    <path d="M -36 48 L 0 108 L 36 48 Z" fill="url(#cone)"/>
    <path d="M -25 56 L -8 84 M -8 56 L 12 88 M 10 56 L 25 66 M -30 64 L -18 84" stroke="#8a5e20" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.55"/>
  </g>

  <!-- Wortmarke -->
  <text x="220" y="182" text-anchor="middle" fill="#f7f2e9"
    font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="52" font-weight="600" letter-spacing="1">
    Oasi del Gusto
  </text>

  <!-- Trennlinie -->
  <line x1="96" y1="204" x2="176" y2="204" stroke="#d9a441" stroke-width="1.5"/>
  <circle cx="220" cy="204" r="3" fill="#d9a441"/>
  <line x1="264" y1="204" x2="344" y2="204" stroke="#d9a441" stroke-width="1.5"/>

  <text x="220" y="236" text-anchor="middle" fill="#e8d5ae"
    font-family="Georgia, serif" font-size="17" letter-spacing="7">
    GELATERIA · CAFFÈ
  </text>
</svg>
